name: release.yml
on:
  workflow_dispatch: {}
  schedule:
    # Mondays at 00:00 UTC. GitHub runs this only from the default branch.
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  empower-plant-release:
    name: Release Build of EmpowerPlant
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Bundle install
        run: bundle install

      - name: Setup Sentry CLI
        uses: mathieu-bour/setup-sentry-cli@v1.3.0
        with:
          # The archive build phase runs upload-symbols.sh, which calls
          # sentry-cli on PATH. The Fastlane plugin bundles its own CLI for
          # sentry_debug_files_upload and sentry_upload_build.
          version: 3.8.0
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Compute version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # YY.M.D drops leading zeros (26.10.7). YYMMDD keeps them (261007).
          # A same-day rerun becomes 26.10.7-1 / 2610071, matching sentry_react_native.
          BASE=$(date -u +'%-y.%-m.%-d')
          CODE=$(date -u +'%y%m%d')
          VERSION="$BASE"
          VERSION_CODE="$CODE"
          n=0
          while gh release view "$VERSION" >/dev/null 2>&1; do
            n=$((n + 1))
            if [ "$n" -gt 20 ]; then
              echo "Stopped after 20 existing releases for ${BASE}." >&2
              exit 1
            fi
            VERSION="${BASE}-${n}"
            VERSION_CODE="${CODE}${n}"
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Release ${VERSION} (build ${VERSION_CODE}, short version ${BASE})"

      - name: Build and upload the release
        shell: bash
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG: "true"
        run: |
          set -euo pipefail
          bundle exec fastlane ios release \
            "marketing_version:${MARKETING_VERSION}" \
            "build_code:${BUILD_CODE}" \
            "release_tag:${RELEASE_TAG}"

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}"
          BUILD_CODE="${{ steps.version.outputs.version_code }}"
          NOTES="$(printf 'Release %s\nVersion %s (%s)\nGenerated by .github/workflows/release.yml\n' \
            "$VERSION" "$MARKETING_VERSION" "$BUILD_CODE")"
          gh release create "$VERSION" build/EmpowerPlant.ipa -t "$VERSION" -n "$NOTES"
