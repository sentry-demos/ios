## Test
name: test.yml

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-15
    env:
      # macos-15 defaults to Xcode 16.4. Its SwiftPM can reject sentry-cocoa's
      # unstable KSCrash dependency, and its iOS 18.5 SDK lacks the iOS 26 calls
      # the app makes (hidesSharedBackground). Same pin as deploy_project.sh.
      # Xcode 26.3's iOS 26.2 runtime has the Makefile's iPhone 17 Pro.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Xcode and simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro ("; then
            echo "No iPhone 17 Pro simulator for $DEVELOPER_DIR. Pass DEVICE_NAME and SIMULATOR_OS to make test." >&2
            xcrun simctl list devices available
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Dependencies
        run: make install-dependencies

      - name: Setup Sentry CLI
        uses: mathieu-bour/setup-sentry-cli@v1.3.0
        with:
          version: 3.3.5
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build and Test
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: 214d9137-2c5a-4eaf-9327-c6031f13795a
          fail_ci_if_error: true
          verbose: true

      - name: Upload to Sentry Size Analysis
        run: |
          xcodebuild archive \
            -project EmpowerPlant.xcodeproj \
            -scheme EmpowerPlant \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/EmpowerPlant.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

          HEAD_REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          UPLOAD_ARGS=(
            --org "$SENTRY_ORG"
            --project "$SENTRY_PROJECT"
            --build-configuration Release
            --head-sha "$GITHUB_SHA"
            --head-ref "$HEAD_REF"
            --vcs-provider github
            --head-repo-name "$GITHUB_REPOSITORY"
          )

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            UPLOAD_ARGS+=(
              --base-sha "$PR_BASE_SHA"
              --base-ref "$GITHUB_BASE_REF"
              --pr-number "$PR_NUMBER"
            )
          fi

          sentry-cli build upload build/EmpowerPlant.xcarchive "${UPLOAD_ARGS[@]}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
