excluded:
  - ".git"
  - "**/SnapshotHelper.swift"
  - ".bundle"
  - "build"
  - "vendor"

# EmpowerPlant is a Sentry demo app that intentionally contains crash-prone
# code, benchmark loops with short variable names, and long demo strings to
# showcase Sentry features. Rules that fire on this intentional code are
# disabled for now instead of changing the implementation.
disabled_rules:
  - file_length
  - force_cast
  - force_try
  - function_body_length
  - function_parameter_count
  - identifier_name
  - line_length
  - non_optional_string_data_conversion
  - shorthand_operator
  - todo
  - type_body_length

# Match swift-format's multiElementCollectionTrailingCommas so both tools
# converge instead of reverting each other's changes.
trailing_comma:
  mandatory_comma: true

# Rules
nesting:
  type_level:
    warning: 3
  function_level:
    warning: 3
type_name:
  max_length:
    warning: 60
    error: 100
